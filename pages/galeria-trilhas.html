      /* STYLE DO MENU */
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Sofia+Sans:ital,wght@0,1;0,400;0,500;0,600;1,200;1,300&display=swap');

  nav{
   display: flex;
   justify-content: flex-end;

  }
  nav ul{
   width: 100%;
   list-style: none;
   display: flex;
   justify-content: flex-end;
   align-items: center;
  }
  nav li{
   height: 60px;
  }
 nav li:first-child{
    margin-right: auto;
}

nav a{
    height: 100%;
    padding: 0 30px;
    text-decoration: none;
    display: flex;
    align-items: center;
    color: #fff;
}

nav a:hover{
    color: #dcdcdc;
}

.icon{
    fill: #fff;
}

.sidebar{
    position: fixed;
    top: 0;
    right: 0;
    height: 100vh;
    width: 280px;
    z-index: 999;
    background-color: rgb(12, 61, 2, 0.2);
    box-shadow: -10px 0 10px rgba(0,0,0,0.1);
    display: none;
    flex-direction: column;
    align-items: flex-start;
    justify-content: flex-start;
    backdrop-filter: blur(10px);
}


@media (max-width: 800px){
    .hideMobile{
        display: none;
    }
}

@media (min-width: 800px){
    .hideDesktop{
        display: none;
    }
}

.container-texto {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-family: sans-serif;
            max-width: 400px;
        }

        .container-texto label {
            font-weight: bold;
            color: #333;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
        }

        textarea:focus {
            border-color: #2E6F40;
            box-shadow: 0 0 5px rgba(19, 80, 29, 0.5);
            outline: none;
        }

        .container-form {
            max-width: 500px;
            margin: 30px auto;
            background: none;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .container-form label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: white;
            font-size: 25px;
        }

        .container-form input,
        .container-form textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .container-form input:focus,
        .container-form textarea:focus {
            border-color: #2E6F40;
            outline: none;
        }

        .container-form button {
            width: 100%;
            background-color: #2E6F40;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .container-form button:hover {
            background-color: #245a34;
        }

</style>
