<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultoria</title>
     <link rel="stylesheet" href="../CSS/consultoria.css">
    
</head>

<body>

    <nav>
        <ul>
            <li class="hideMobile"><a href="#">Início</a></li>
            <li class="hideMobile"><a href="#">Guia Trilhas</a></li>
            <li class="hideMobile"><a href="#">Galeria de trilhas</a></li>
            <li class="hideMobile"><a href="#">Consultoria</a></li>
            <li class="hideMobile"><a href="#">Mapa Rotas</a></li>
            <li class="hideMobile"><a href="#">Landing Page</a></li>
            <li class="hideMobile"><a href="#">Calculadora</a></li>
            <li class="hideMobile"><a href="#">Sobre</a></li>
            <li class="hideDesktop" onclick="showSidebar()"><a href="#">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960"
                    width="24px" fill="#e3e3e3">
                    <path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z" />
                </svg>
            </a></li>
        </ul>

        <ul class="sidebar">
            <li onclick="hideSidebar()"><a href="#">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960"
                    width="24px" fill="#e3e3e3">
                    <path
                        d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
                </svg>
            </a></li>
            <li><a href="#">Início</a></li>
            <li><a href="#">Guia Trilhas</a></li>
            <li><a href="#">Galeria de trilhas</a></li>
            <li><a href="#">Consultoria</a></li>
            <li><a href="#">Mapa Rotas</a></li>
            <li><a href="#">Landing Page</a></li>
            <li><a href="#">Calculadora</a></li>
            <li><a href="#">Sobre</a></li>
        </ul>
    </nav>

    <form action="#" method="POST">
        <div class="container-form">
            <p>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Informe o nome completo">
            </p>
            <p>
                <label for="email">Email:</label>
                <input type="text" id="email" name="email" placeholder="Informe o email">
            </p>
            <p>
                <label for="telefone">Telefone:</label>
                <input type="text" id="telefone" name="telefone" placeholder="Informe o telefone">
            </p>
            <div class="grupo-formulario">
                <label for="data-nascimento">Data de Nascimento:</label>
                <input type="date" id="data-nascimento" name="data-nascimento" min="1900-01-01" max="2010-05-25"
                    required>
            </div>
            <br>
            <div class="container-texto">
                <label for="comentario">Deixe seu comentário:</label>
                <textarea id="comentario" name="comentario" rows="5" cols="30"
                    placeholder="Escreva aqui..."></textarea>
            </div>
            <button type="submit">Enviar Mensagem</button>
        </div>
    </form>

    <script>
        function showSidebar() {
            const sidebar = document.querySelector(".sidebar");
            sidebar.style.display = "flex";
        }

        function hideSidebar() {
            const sidebar = document.querySelector(".sidebar");
            sidebar.style.display = "none";
        }
    </script>
</body>

</html>
